name: Publish Kodi 21-compatible MDM Skin 0.3.1

on:
  push:
    paths:
      - .github/workflows/publish-skin-031.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          persist-credentials: true

      - name: Checkout MDM Skin source
        uses: actions/checkout@v4
        with:
          repository: MDMAinsley/skin.mdm.skin
          ref: main
          path: skin-source

      - name: Build and publish skin to both Kodi channels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import xml.etree.ElementTree as ET
          import zipfile

          source = Path("skin-source")
          site = Path("published")
          addon_id = "skin.mdm.skin"
          version = "0.3.1"
          xml_source = (source / "addon.xml").read_text(encoding="utf-8")
          item = ET.fromstring(xml_source)
          assert item.attrib["id"] == addon_id
          assert item.attrib["version"] == version
          assert any(dependency.attrib.get("addon") == "xbmc.gui" and dependency.attrib.get("version") == "5.17.0"
                     for dependency in item.find("requires"))
          assert (site / "addons.xml").exists() and (site / "dev" / "addons.xml").exists()
          source_commit = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()

          # Build a real Kodi add-on archive, with the addon ID as the top-level folder.
          archive = site / "_skin-0.3.1-build.zip"
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for file in sorted(source.rglob("*")):
                  if not file.is_file() or ".git" in file.relative_to(source).parts:
                      continue
                  z.write(file, str(Path(addon_id) / file.relative_to(source)))
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert f"{addon_id}/addon.xml" in names
              assert len(names) >= 200, "Unexpectedly small skin archive"
              assert ET.fromstring(z.read(f"{addon_id}/addon.xml")).attrib["version"] == version
          archive_bytes = archive.read_bytes()
          md5 = hashlib.md5(archive_bytes).hexdigest()
          sha256 = lambda b: hashlib.sha256(b).hexdigest()
          source_addon = re.sub(r"^<\?xml[^>]*>\s*", "", xml_source, count=1)

          for channel in (site, site / "dev"):
              index_path = channel / "addons.xml"
              original = index_path.read_text(encoding="utf-8")
              pattern = r'<addon\s+id="skin\.mdm\.skin"[\s\S]*?</addon>'
              updated, replacements = re.subn(pattern, lambda _: source_addon.strip(), original, count=1)
              assert replacements == 1, "Expected exactly one skin record in " + str(index_path)
              ET.fromstring(updated)
              assert 'version="0.3.1"' in updated

              dest = channel / addon_id
              dest.mkdir(exist_ok=True)
              zip_name = f"{addon_id}-{version}.zip"
              zip_path = dest / zip_name
              shutil.copyfile(archive, zip_path)
              checksum_path = dest / f"{zip_name}.md5"
              checksum_path.write_text(md5, encoding="ascii")
              addon_path = dest / "addon.xml"
              addon_path.write_text(xml_source, encoding="utf-8")
              change_path = dest / f"changelog-{version}.txt"
              change_path.write_text("0.3.1: Minimum xbmc.gui lowered to 5.17.0 for Kodi 21 Omega compatibility testing.\n", encoding="utf-8")

              index_path.write_text(updated, encoding="utf-8")
              index_checksum_path = channel / "addons.xml.md5"
              index_checksum_path.write_text(hashlib.md5(updated.encode("utf-8")).hexdigest(), encoding="ascii")

              manifest_path = channel / "release-manifest.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest["source"][addon_id] = {"commit": source_commit, "version": version}
              manifest["archives"][addon_id] = md5
              for path in (zip_path, checksum_path, addon_path, change_path, index_path, index_checksum_path):
                  manifest["files"][path.relative_to(channel).as_posix()] = sha256(path.read_bytes())
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          archive.unlink()
          print("Published MDM Skin", version, "to Live and Dev, checksum", md5)
          PY

      - name: Commit generated release
        shell: bash
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons.xml addons.xml.md5 release-manifest.json skin.mdm.skin dev/addons.xml dev/addons.xml.md5 dev/release-manifest.json dev/skin.mdm.skin
          if git diff --cached --quiet; then
            echo "No release changes"
          else
            git commit -m "Publish Kodi 21-compatible MDM Skin 0.3.1 to Live and Dev"
            git push origin HEAD:gh-pages
          fi
